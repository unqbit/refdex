    });
    var shown = Math.min(hits.length, 30);
    $("hitcount").textContent = shown ? shown + (hits.length > 30 ? "+" : "") + " hits" : "no match";
  });
}

/* The panes are dragged by strips laid over the grid gaps. A gap is one pixel wide,
   which is too thin to catch, so the strips are wider than what they sit on. */
var PANES = "refdex-panes";
function tracks(prop){
  return getComputedStyle($("app"))[prop].split(" ").map(parseFloat);
}
/* Reads one of the pane variables off the stylesheet, so the numbers live in one
   place and the script does not carry a second copy of them. */
function pxVar(name){
  return parseFloat(getComputedStyle($("app")).getPropertyValue(name)) || 0;
}
function setPane(name, px){
  $("app").style.setProperty(name, px + "px");
}
function layout(){
  if($("app").hidden) return;
  var box = $("app").getBoundingClientRect();
  var cols = tracks("gridTemplateColumns");
  var rows = tracks("gridTemplateRows");
  var a = $("gripA"), b = $("gripB"), c = $("gripC");
  a.style.left = (cols[0] - 3) + "px"; a.style.top = "0"; a.style.height = box.height + "px";
  b.style.left = (cols[0] + cols[1] - 2) + "px"; b.style.top = "0"; b.style.height = box.height + "px";
  c.style.top = (rows[0] - 3) + "px"; c.style.left = "0"; c.style.width = cols[0] + "px";
}
function savePanes(){
  var cols = tracks("gridTemplateColumns");
  var rows = tracks("gridTemplateRows");
  try {
    localStorage.setItem(PANES, JSON.stringify({ c1: cols[0], c2: cols[1], r1: rows[0] }));
  } catch(e) { /* storage turned off; the panes just start at their defaults */ }
}
/* A saved size that cannot be read must not keep the app from opening. */
function loadPanes(){
  try {
    var v = JSON.parse(localStorage.getItem(PANES) || "null");
    if(v){
      if(v.c1 > 0) setPane("--c1", v.c1);
      if(v.c2 > 0) setPane("--c2", v.c2);
      if(v.r1 > 0) setPane("--r1", v.r1);
    }
  } catch(e) { }
  fitPanes();
}

/* Sizes are kept in pixels, so a layout saved on a big window can be bigger than the
   window it is read back into. Left alone it pushes a pane out of the frame and takes
   the boundary that would bring it back with it. Both axes, for the same reason. */
function fitPanes(){
  if($("app").hidden) return;
  var box = $("app").getBoundingClientRect();
  if(box.width <= 0 || box.height <= 0) return;
  /* The gaps between the panes take room the tracks cannot have. Leaving them out of
     the sum puts the last pane a couple of pixels past the edge. */
  var gaps = getComputedStyle($("app"));
  var wide = box.width - (parseFloat(gaps.columnGap) || 0) * 2;
  var tall = box.height - (parseFloat(gaps.rowGap) || 0);
  var cols = tracks("gridTemplateColumns");
  var lo = pxVar("--min-left"), mid = pxVar("--min-mid"), doc = pxVar("--min-doc");
  var c1 = clamp(cols[0], lo, Math.max(lo, wide - mid - doc));
  var c2 = clamp(cols[1], mid, Math.max(mid, wide - c1 - doc));
  setPane("--c1", c1);
  setPane("--c2", c2);
  var row = pxVar("--min-row");
  setPane("--r1", clamp(tracks("gridTemplateRows")[0], row, Math.max(row, tall - row)));
}
function grip(el, move){
  el.addEventListener("pointerdown", function(e){
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    var box = $("app").getBoundingClientRect();
    var onMove = function(ev){ move(ev, box); layout(); };
    var onUp = function(ev){
      el.releasePointerCapture(ev.pointerId);
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      savePanes();
      if(!$("term").hidden && termNow() && termNow().fit) termNow().fit.fit();
    };
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
  });
}
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

grip($("gripA"), function(ev, box){
  var cols = tracks("gridTemplateColumns");
  /* The two left panes share what they had: this boundary moves width between them
     and leaves the document pane where it is. */
  var pair = cols[0] + cols[1];
  var lo = pxVar("--min-left"), mid = pxVar("--min-mid");
  var c1 = clamp(ev.clientX - box.left, lo, Math.max(lo, pair - mid));
  setPane("--c1", c1);
  setPane("--c2", pair - c1);
});
grip($("gripC"), function(ev, box){
  var row = pxVar("--min-row");
  setPane("--r1", clamp(ev.clientY - box.top, row, Math.max(row, box.height - row)));
});
grip($("gripB"), function(ev, box){
  var cols = tracks("gridTemplateColumns");
  var wide = ev.clientX - box.left - cols[0];
  var mid = pxVar("--min-mid"), doc = pxVar("--min-doc");
  setPane("--c2", clamp(wide, mid, Math.max(mid, box.width - cols[0] - doc)));
});
window.addEventListener("resize", function(){
  fitPanes();
  layout();
  if(!$("term").hidden && termNow() && termNow().fit) termNow().fit.fit();
});
loadPanes();
</script>
</body>
</html>
